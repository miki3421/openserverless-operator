---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: openserverless
  labels:
    name: kafka
    app: kafka
spec:
  serviceName: kafka
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      name: kafka
  template:
    metadata:
      annotations:
        openserverless.org/messaging-isolation: v1
      labels:
        name: kafka
        app: kafka
        openserverless.org/kafka-profile: kraft-single-v1
    spec:
      restartPolicy: Always
      volumes:
      - name: kafka-pvc
        persistentVolumeClaim:
          claimName: kafka-kraft-pvc-data
      - name: kafka-tmp
        emptyDir:
          sizeLimit: 256Mi
      containers:
      - name: kafka
        image: docker.io/miki3421/ops-advanced-kafka:4.4.0-20261107-r4@sha256:4cca13390dc2e488b2e44e2f56da9fa32e01a37430cb15eea734f5db3e34d5dd
        imagePullPolicy: IfNotPresent
        command:
        - /opt/ops-kafka/start.sh
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: kafka-pvc
          mountPath: /kafka
        - name: kafka-tmp
          mountPath: /tmp
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9071
          name: metrics
        - name: controller
          containerPort: 9093
        livenessProbe:
          tcpSocket:
            port: kafka
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /opt/ops-kafka/ready.sh
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          exec:
            command:
            - /opt/ops-kafka/ready.sh
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 10
      - name: volume-exporter
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: docker.io/miki3421/ops-advanced-volume-exporter:20261105-r2@sha256:093ff7128164d3d4740528cdd4bd65b821e589f175a26630212acf25a087bdee
        imagePullPolicy: IfNotPresent
        args:
        - --volume-dir=kafka-volume:/kafka
        ports:
        - name: metrics-volume
          containerPort: 9888
        volumeMounts:
        - mountPath: /kafka
          name: kafka-pvc
          readOnly: true
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
