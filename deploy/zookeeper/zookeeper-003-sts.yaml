---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: openserverless
  labels:
    name: zookeeper
    app: zookeeper
spec:
  serviceName: zookeeper
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      name: zookeeper
  template:
    metadata:
      annotations:
        openserverless.org/messaging-isolation: v1
      labels:
        name: zookeeper
        app: zookeeper
    spec:
      restartPolicy: Always
      volumes:
      - name: zk-config
        configMap:
          name: zookeeper
      - name: zookeeper-pvc-data
        persistentVolumeClaim:
          claimName: zookeeper-pvc-data
      - name: zookeeper-pvc-datalog
        persistentVolumeClaim:
          claimName: zookeeper-pvc-datalog
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      containers:
      - name: zookeeper
        image: docker.io/miki3421/ops-advanced-zookeeper:3.9.7-20261107-r3@sha256:137adefa2395428d951f0846ec5a442e98e0d574d7d4efe78bd4fcee1bea4718
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - set -eu; if test -e /data/myid; then test "$(cat /data/myid)" = 1; else
          printf "1\n" > /data/myid; fi; exec zkServer.sh start-foreground
        ports:
        - name: zookeeper
          containerPort: 2181
        - name: server
          containerPort: 2888
        - name: leader-election
          containerPort: 3888
        livenessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - exec 3<>/dev/tcp/127.0.0.1/2181; printf ruok >&3; read -r -t 2 -N 4
              reply <&3; test "$reply" = imok
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /conf
          name: zk-config
        - mountPath: /data
          name: zookeeper-pvc-data
        - mountPath: /datalog
          name: zookeeper-pvc-datalog
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          tcpSocket:
            port: 2181
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
