apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: openserverless
  labels:
    ops.openserverless.org/redis-layout: v810
spec:
  replicas: 1
  serviceName: redis
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      name: redis
  template:
    metadata:
      labels:
        name: redis
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: bootstrap-acl
        image: "docker.io/library/redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          if [ -f /data/.ops-redis-v810 ]; then
            test -s /data/users.acl
          else
            test ! -e /data/users.acl
            umask 077
            cp /bootstrap/users.acl /data/users.acl
            touch /data/.ops-redis-v810
          fi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: redis-data-v810
          mountPath: /data
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      containers:
      - name: redis
        image: "docker.io/library/redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6"
        imagePullPolicy: IfNotPresent
        command: ["redis-server", "/redis-master/redis.conf"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: redis-admin-v810
              key: password
        ports:
        - name: redis
          containerPort: 6379
        startupProbe:
          exec:
            command: ["redis-cli", "-e", "--user", "ops-admin", "ping"]
          periodSeconds: 2
          failureThreshold: 150
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command: ["redis-cli", "-e", "--user", "ops-admin", "ping"]
          periodSeconds: 3
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "-e", "--user", "ops-admin", "ping"]
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /redis-master
          readOnly: true
        - name: redis-data-v810
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: redis-cm
          items:
          - key: redis-conf
            path: redis.conf
      - name: bootstrap
        secret:
          secretName: redis-admin-v810
          defaultMode: 0440
          items:
          - key: users.acl
            path: users.acl
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: redis-data-v810
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 10Gi
