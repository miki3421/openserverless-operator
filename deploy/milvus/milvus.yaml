# Source: milvus/templates/standalone-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openserverless-milvus-standalone
  namespace: openserverless
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/instance: openserverless-milvus
    component: "standalone"    
  annotations:
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
      app.kubernetes.io/instance: openserverless-milvus
      component: "standalone"
  template:
    metadata:
      labels:
        name: openserverless-milvus
        app.kubernetes.io/name: milvus
        app.kubernetes.io/instance: openserverless-milvus
        component: "standalone"
      annotations:        
        whisks.openserverless.org/annotate-version: "true"                       
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: default
      automountServiceAccountToken: false
      initContainers:
      containers:
      - name: standalone
        image: "docker.io/miki3421/ops-advanced-milvus:3.0.2-zero-grace-20261016@sha256:2d0aeb4c19a657369636a1592d56ccac164a718a3f447ee7683ce53769153c37"
        imagePullPolicy: IfNotPresent
        args: [ "milvus", "run", "standalone"]
        ports:
          - name: milvus
            containerPort: 19530
            protocol: TCP
          - name: metrics
            containerPort: 9091
            protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 150
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - |-
              marker=/milvus/tools/ops-milvus-recovered
              if ! curl -fsS --max-time 2 http://127.0.0.1:9091/healthz >/dev/null; then
                rm -f "$marker"
                exit 1
              fi
              # PID 1 start time changes on container restart; the tools emptyDir
              # survives that restart, so a file's existence alone is insufficient.
              IFS= read -r process </proc/1/stat
              process=${process##*) }
              set -- $process
              shift 19
              generation=$1
              if [ -r "$marker" ]; then
                IFS= read -r recovered <"$marker" || recovered=
                [ "$recovered" != "$generation" ] || exit 0
              fi
              state=$(curl -fsS --max-time 2 'http://127.0.0.1:9091/management/replica/loadconfig/compliance?output=summary')
              [ "$state" = '{"state":"Ready"}' ]
              printf '%s\n' "$generation" >"$marker"
          periodSeconds: 2
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 1
        resources:
          {}
        env:
        volumeMounts:
        - name: etcd-client-tls
          mountPath: /etc/etcd/client
          readOnly: true
        - mountPath: /milvus/tools
          name: tools
        - name: milvus-config
          mountPath: /milvus/configs/default.yaml
          subPath: default.yaml
          readOnly: true
        - name: milvus-config
          mountPath: /milvus/configs/user.yaml
          subPath: user.yaml
          readOnly: true
        - name: milvus-data-disk
          mountPath: "/var/lib/milvus"
          subPath: 
      volumes:
      - name: etcd-client-tls
        secret:
          secretName: openserverless-etcd-client-tls-v37
          defaultMode: 0440
      - emptyDir: {}
        name: tools
      - name: milvus-config
        configMap:
          name: openserverless-milvus
      - name: milvus-data-disk
        persistentVolumeClaim:
          claimName: openserverless-milvus-etcd37
