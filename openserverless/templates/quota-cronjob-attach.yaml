---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{name}}
  namespace: openserverless
spec:
  schedule: "{{schedule}}"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: {{name}}
            image: "{{image}}"
            env:
            - name: POSTGRES_ENABLED
              value: "{{postgres_enabled}}"
            - name: REDIS_ENABLED
              value: "{{redis_enabled}}"
            - name: MONGODB_ENABLED
              value: "{{mongodb_enabled}}"
            - name: MONGODB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: openserverless-mongodb-auth
                  key: username
                  optional: true
            - name: MONGODB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openserverless-mongodb-auth
                  key: password
                  optional: true
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-openserverless-secret
                  key: superUserPassword
                  optional: true
            - name: REDIS_PASSWORD
              value: {{redis_password}}         
