apiVersion: apps/v1
kind: Deployment
metadata:
  name: openserverless-prometheus-server
  namespace: openserverless
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: openserverless-prometheus
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1  
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: openserverless-prometheus
      app.kubernetes.io/name: prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: openserverless-prometheus
        app.kubernetes.io/name: prometheus
        name: prometheus
      annotations:
        openserverless.org/monitoring-boundary: "1"
        whisks.openserverless.org/annotate-version: "true"         
    spec:
      serviceAccount: openserverless-prometheus-server
      serviceAccountName: openserverless-prometheus-server
      terminationGracePeriodSeconds: 300
      containers:
      - name: prometheus-server
        args:
        - --storage.tsdb.retention.time=24h
        - --config.file=/etc/config/prometheus.yml
        - --storage.tsdb.path=/data
        - --web.enable-lifecycle
        - --web.listen-address=:9999
        image: docker.io/miki3421/ops-advanced-prometheus:3.16.0-20261106-r1@sha256:14dd90dd67668cd945f0f54fab389c9b817df0332d0927eed23f6f06666f569b
        imagePullPolicy: IfNotPresent
        ports:
        - name: web
          containerPort: 9999
          protocol: TCP
        livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9999
            initialDelaySeconds: 60
            timeoutSeconds: 5
        readinessProbe:
            httpGet:
              path: /-/ready
              port: 9999      
        volumeMounts:
        - mountPath: /etc/config
          name: config-volume
        - mountPath: /data
          name: storage-volume
      - name: prometheus-server-configmap-reload
        args:
        - --watched-dir=/etc/config
        - --reload-url=http://127.0.0.1:9999/-/reload
        image: quay.io/prometheus-operator/prometheus-config-reloader:v0.95.1@sha256:15f6aec87a20e25f33371ebf9f37bfba33d783f8f7c7dcc3448720c1a5397c2c
        imagePullPolicy: IfNotPresent        
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/config
          name: config-volume
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: openserverless-prometheus-server
        name: config-volume
      - name: storage-volume
        persistentVolumeClaim:
          claimName: openserverless-prometheus-server-pvc       
