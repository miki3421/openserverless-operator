---
apiVersion: kubegres.reactive-tech.io/v1
kind: Kubegres
metadata:
  name: openserverless-postgres
  namespace: openserverless
spec:
   replicas: 2
   image: docker.io/miki3421/ops-advanced-postgres:18.6-pgvector0.8.6-20261109-libxml2-r1@sha256:eece1d6ad7208838a4eaa56beef57bc82db2e7ff17b7fcce23dbcf29740cf5b9
   database:
      volumeMount: /var/lib/postgresql
      size: 200Mi
   customConfig: openserverless-postgres-conf    
   env:
      - name: POSTGRES_PASSWORD
        valueFrom:
           secretKeyRef:
              name: postgres-openserverless-secret
              key: superUserPassword
      - name: POSTGRES_REPLICATION_PASSWORD
        valueFrom:
           secretKeyRef:
              name: postgres-openserverless-secret
              key: replicationUserPassword
      - name: POSTGRES_OPENSERVERLESS_DB_PASSWORD
        valueFrom:
           secretKeyRef:
              name: postgres-openserverless-secret
              key: openserverlessUserPassword
