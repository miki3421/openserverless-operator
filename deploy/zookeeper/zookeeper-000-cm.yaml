---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper
  namespace: openserverless
  labels:
    app: zookeeper
data:
  zoo.cfg: 'tickTime=2000

    clientPort=2181

    initLimit=5

    syncLimit=2

    dataDir=/data

    dataLogDir=/datalog

    standaloneEnabled=true

    admin.enableServer=false

    4lw.commands.whitelist=ruok,srvr

    autopurge.snapRetainCount=3

    autopurge.purgeInterval=1

    '
  logback.xml: '<configuration><appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender"><encoder><pattern>%date
    %-5level %logger - %msg%n</pattern></encoder></appender><root level="INFO"><appender-ref
    ref="STDOUT"/></root></configuration>

    '
